# Tenant: link3
# One section per profile. Each profile lists every shard's server.
# A single deploy command (deploy.sh link3 <profile>) hits every shard in order.
# First deploy of a profile: add --init-state so each new shard gets an empty state file.

# ----------------------------------------------------------------------
# DEV — 3 shards on developer VMs
# ----------------------------------------------------------------------
[dev]
description           = link3 dev cluster, 3 shards
inventory_tenant      = link3

# Service tuning — applied identically to every shard in this profile.
# listen_address: empty = all interfaces; an IP = that IP; private_ip = each host's private_ip.
# The API has no authentication — bind to a private address.
listen_address        = private_ip
listen_port           = 7001
# {shard_id} is replaced per shard, so shards sharing a host never share a state file.
state_path            = /var/lib/bucket-next/shard-{shard_id}/state.json
segment_size          = 1000
segment_refill_watermark = 0.5
clock_drift_tolerance_ms = 0
snowflake_epoch_ms    = 1704067200000

# uuid key: a file holding 32/48/64 hex chars, identical for every shard of the profile.
# Keep it under ssh-inventory/<tenant>/keys/ (gitignored). Create with:
#   openssl rand -hex 16 > ssh-inventory/link3/keys/uuid-dev.key
# Set it BEFORE the first uuid ID is issued; it can never change afterwards.
#uuid_key_file        = ssh-inventory/link3/keys/uuid-dev.key

# Cluster sizing — fixed once (the id space is partitioned for it); shardN.server keys 1..K, K <= total_shards.
total_shards          = 3

# Per-shard server assignment: shardN.server = <inventory-host-file-name>
# The host file lives at deploy/ssh-inventory/<inventory_tenant>/hosts/<name>
shard1.server         = link3-dev-1
shard2.server         = link3-dev-2
shard3.server         = link3-dev-3


# ----------------------------------------------------------------------
# STAGING — 3 shards on staging VMs
# ----------------------------------------------------------------------
[staging]
description           = link3 staging cluster, 3 shards
inventory_tenant      = link3

listen_address        = private_ip
listen_port           = 7001
state_path            = /var/lib/bucket-next/shard-{shard_id}/state.json
segment_size          = 2000
segment_refill_watermark = 0.5
#uuid_key_file        = ssh-inventory/link3/keys/uuid-staging.key
total_shards          = 3

shard1.server         = link3-staging-1
shard2.server         = link3-staging-2
shard3.server         = link3-staging-3


# ----------------------------------------------------------------------
# PROD — 5 shards on production VMs (high TPS: bigger segments)
# ----------------------------------------------------------------------
[prod]
description           = link3 production cluster, 5 shards
inventory_tenant      = link3

listen_address        = private_ip
listen_port           = 7001
state_path            = /var/lib/bucket-next/shard-{shard_id}/state.json
segment_size          = 10000
segment_refill_watermark = 0.5
#uuid_key_file        = ssh-inventory/link3/keys/uuid-prod.key
total_shards          = 5

shard1.server         = link3-prod-1
shard2.server         = link3-prod-2
shard3.server         = link3-prod-3
shard4.server         = link3-prod-4
shard5.server         = link3-prod-5
