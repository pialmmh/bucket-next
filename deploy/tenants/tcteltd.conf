# Tenant: tcteltd
# Example of a small two-shard tenant. Add profiles and shards as needed.

[dev]
description           = tcteltd dev, 2 shards on one dev box (own port + own state file each)
inventory_tenant      = tcteltd

listen_address        = private_ip
listen_port           = 7001
state_path            = /var/lib/bucket-next/shard-{shard_id}/state.json
segment_size          = 1000
segment_refill_watermark = 0.5
total_shards          = 2

# Both host files point at the same machine with a different listen_port_override.
shard1.server         = tcteltd-dev-1a
shard2.server         = tcteltd-dev-1b


[prod]
description           = tcteltd production, 2 shards on dedicated VMs
inventory_tenant      = tcteltd

listen_address        = private_ip
listen_port           = 7001
state_path            = /var/lib/bucket-next/shard-{shard_id}/state.json
segment_size          = 10000
segment_refill_watermark = 0.5
#uuid_key_file        = ssh-inventory/tcteltd/keys/uuid-prod.key
total_shards          = 2

shard1.server         = tcteltd-prod-1
shard2.server         = tcteltd-prod-2
