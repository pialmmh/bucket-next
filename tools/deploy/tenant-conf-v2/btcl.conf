# btcl — bucket-next V2 deployment configuration (the routesphere convention).
# WHERE it runs. WHAT the service is configured with lives in config/tenants/btcl/<profile>/profile-<profile>.yml.
# The server is resolved from the SHARED ssh inventory (never a copy in this repository):
#   <inventory>/servers/<inventory_tenant>/hosts/<server>      host=, port=, user=, key=, private_ip=
#
# Keys of a profile:
#   inventory_tenant   required   the tenant folder of the ssh inventory
#   server             required   the host every shard of this profile runs on, unless a shard says otherwise
#   shards             optional   which shard ids are deployed (comma list); default = 1..total_shards of the profile YAML.
#                                 An id of the cluster that is not listed is DECLARED, NOT DEPLOYED - the plan says so.
#   shard<N>.server    optional   another host for shard N
#   shard<N>.listen_port optional another port for shard N (two shards on one host)
#   uuid_key_file      optional   a file OUTSIDE git holding the cluster's uuid key (32/48/64 hex); unset = the built-in key
#   deploy             optional   false = the script plans (--dry-run) and refuses to touch the server
#   description        optional

[bed]
inventory_tenant = btcl
server           = radius2
description      = the wifi bed's id generator - ONE shard of a declared two, 10.10.188.2:7001; clients prime-context-core-s2 and (L3) ad-sphere-s2
shards           = 1

[prod]
inventory_tenant = btcl
server           = radius1
description      = production - DECLARED, NOT DEPLOYED (nothing on production: the owner, 2026-10-10)
shards           = 1
deploy           = false
