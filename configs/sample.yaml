# bucket-next — sample configuration
# All keys; defaults shown for the optional ones.
# First start of a brand-new shard: bucket-next -config <file> -init

# Required.
shard_id: 1            # this node's shard id, 1..total_shards — unique in the cluster
total_shards: 1        # cluster size, 1..1024 — identical on every node
listen_address: ""     # IP to bind; "" = all interfaces. The API has no auth: use 127.0.0.1 on a
                       # dev box and the host's private IP on a server.
listen_port: 7001      # HTTP port
state_path: ./data/state.json   # this shard's own file; parent dir auto-created

# Optional — tuning knobs.
segment_size: 1000     # IDs reserved per durable disk write (int/long/uuid* types)
segment_refill_watermark: 0.5   # start the background refill when this fraction is used
clock_drift_tolerance_ms: 0     # snowflake: extra backward clock jump tolerated by waiting

# Snowflake epoch. Default = 2024-01-01 UTC in unix-millis. Identical on every node; never change.
snowflake_epoch_ms: 1704067200000

# uuid key: 32, 48 or 64 hex chars (openssl rand -hex 16). Identical on every node; set it
# before the first uuid ID and never change it. Unset = built-in key (unique, predictable).
#uuid_key: 00112233445566778899aabbccddeeff
